name: Daily Tech Digest

on:
  schedule:
      - cron: "0 12 * * *"  # 12:00 UTC = 8:00 AM EDT
        workflow_dispatch:

        jobs:
          send-digest:
              runs-on: ubuntu-latest
                  timeout-minutes: 15
                      steps:
                            - uses: actions/checkout@v4

                                  - name: Restore seen articles cache
                                          uses: actions/cache@v4
                                                  with:
                                                            path: seen_articles.json
                                                                      key: seen-articles-${{ github.run_id }}
                                                                                restore-keys: seen-articles-

                                                                                      - uses: actions/setup-python@v5
                                                                                              with:
                                                                                                        python-version: "3.12"
                                                                                                                  cache: "pip"
                                                                                                                  
                                                                                                                        - run: pip install -r requirements.txt
                                                                                                                        
                                                                                                                              - name: Run digest
                                                                                                                                      env:
                                                                                                                                                ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                                                                                                                                                          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
                                                                                                                                                                    RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
                                                                                                                                                                            run: python digest.py
                                                                                                                                                                            
                                                                                                                                                                                  - name: Save seen articles cache
                                                                                                                                                                                          if: always()
                                                                                                                                                                                                  uses: actions/cache@v4
                                                                                                                                                                                                          with:
                                                                                                                                                                                                                    path: seen_articles.json
                                                                                                                                                                                                                              key: seen-articles-${{ github.run_id }}
